<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#1a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🐍 Sunset Snake</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#1a0a1a; color:#ffe0d0; font-family:system-ui,-apple-system,sans-serif; }
#gameWrap { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px; }
#menuWrap { display:flex; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:linear-gradient(180deg,#ff6b35 0%,#f7931e 25%,#ff5e78 55%,#c44569 80%,#2c1e4a 100%); }
#menuWrap h1 { font-size:36px; color:#fff; text-shadow:0 0 20px rgba(255,100,50,0.6); letter-spacing:2px; }
#menuWrap .subtitle { font-size:14px; color:rgba(255,255,255,0.7); margin-top:-10px; }
.menu-btn { padding:14px 50px; border-radius:14px; border:2px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.35); color:#fff; font-size:16px; font-weight:700; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all 0.2s; min-width:220px; text-align:center; }
.menu-btn:hover, .menu-btn:active { background:rgba(0,0,0,0.55); transform:scale(1.05); border-color:rgba(255,255,255,0.6); }
.menu-btn.primary { background:linear-gradient(135deg,#ff6b35,#f7931e); border:none; box-shadow:0 4px 20px rgba(255,100,50,0.4); }
#settingsWrap { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:linear-gradient(180deg,#2c1e4a 0%,#1a0a1a 100%); padding:20px; }
#settingsWrap h2 { color:#ff8844; font-size:24px; }
.setting-row { display:flex; align-items:center; gap:12px; width:100%; max-width:300px; justify-content:space-between; background:rgba(255,255,255,0.05); padding:12px 16px; border-radius:10px; }
.setting-row label { font-size:14px; color:#ffe0d0; }
.setting-row select, .setting-row input[type="range"] { background:#2a1a2a; color:#ffe0d0; border:1px solid #ff6644; border-radius:6px; padding:4px 8px; font-size:13px; }
.back-btn { margin-top:10px; padding:10px 30px; border-radius:10px; border:2px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; font-size:14px; cursor:pointer; }
#canvas-container { position:relative; width:100%; max-width:420px; }
#snakeCanvas { width:100%; border-radius:16px; border:3px solid #ff6644; background:linear-gradient(180deg,#ff6b35 0%,#f7931e 20%,#ff5e78 50%,#c44569 80%,#2c1e4a 100%); box-shadow:0 0 30px rgba(255,100,50,0.3); }
.hud { display:flex; gap:16px; font-size:14px; margin-bottom:4px; }
.hud b { color:#ffcc44; }
#controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
#controls button { padding:8px 18px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; color:#fff; }
#btnStart { background:linear-gradient(135deg,#ff6b35,#f7931e); }
#btnPause { background:linear-gradient(135deg,#667eea,#764ba2); }
#btnReset { background:linear-gradient(135deg,#ff416c,#ff4b2b); }
#btnMenu { background:linear-gradient(135deg,#444,#666); }
.joystick-wrap { display:flex; gap:20px; justify-content:center; align-items:center; width:100%; max-width:400px; margin-top:4px; }
.joystick-box { display:flex; flex-direction:column; align-items:center; gap:2px; }
.joystick-box span { font-size:10px; color:rgba(255,200,150,0.5); }
.joystick { width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.15); position:relative; touch-action:none; }
.joystick .stick { width:44px; height:44px; border-radius:50%; background:rgba(0,200,255,0.3); border:2px solid rgba(0,200,255,0.6); position:absolute; top:33px; left:33px; box-shadow:0 0 12px rgba(0,200,255,0.3); }
#gameOverMsg { display:none; position:fixed; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(20,5,15,0.95); padding:28px 40px; border-radius:20px; border:2px solid #ff6644; text-align:center; box-shadow:0 0 40px rgba(255,100,50,0.3); z-index:100; }
#gameOverMsg h3 { font-size:28px; margin-bottom:8px; color:#ff6644; }
#gameOverMsg p { color:#cc8866; font-size:14px; }
#leaderboard { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(20,5,15,0.95); padding:24px 32px; border-radius:16px; border:2px solid #ff6644; z-index:100; min-width:260px; }
#leaderboard h3 { color:#ff8844; margin-bottom:12px; text-align:center; }
#leaderboard ol { color:#ffe0d0; font-size:14px; line-height:2; padding-left:20px; }
#leaderboard ol li:nth-child(1) { color:#ffd700; font-weight:bold; }
#leaderboard ol li:nth-child(2) { color:#c0c0c0; }
#leaderboard ol li:nth-child(3) { color:#cd7f32; }
.leader-close { margin-top:14px; width:100%; padding:8px; border-radius:8px; border:none; background:linear-gradient(135deg,#ff6b35,#f7931e); color:#fff; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="menuWrap">
  <h1>🐍 Sunset Snake</h1>
  <div class="subtitle">Погрузись в закат</div>
  <button class="menu-btn primary" onclick="showGame()">▶ Новая игра</button>
  <button class="menu-btn" onclick="showLeaderboard()">🏆 Рекорды</button>
  <button class="menu-btn" onclick="showSettings()">⚙️ Настройки</button>
  <button class="menu-btn" onclick="exitApp()">🚪 Выход</button>
</div>

<!-- SETTINGS -->
<div id="settingsWrap">
  <h2>⚙️ Настройки</h2>
  <div class="setting-row">
    <label>🚀 Скорость</label>
    <select id="setSpeed">
      <option value="200">Медленно</option>
      <option value="120" selected>Нормально</option>
      <option value="70">Быстро</option>
      <option value="40">Безумно</option>
    </select>
  </div>
  <div class="setting-row">
    <label>🐍 Стиль змейки</label>
    <select id="setStyle">
      <option value="rainbow" selected>🌈 Радуга</option>
      <option value="fire">🔥 Огонь</option>
      <option value="neon">💜 Неон</option>
      <option value="gold">✨ Золото</option>
    </select>
  </div>
  <div class="setting-row">
    <label>🔊 Звук</label>
    <select id="setSound">
      <option value="on" selected>Включён</option>
      <option value="off">Выключен</option>
    </select>
  </div>
  <div class="setting-row">
    <label>📳 Вибрация</label>
    <select id="setVibro">
      <option value="on" selected>Включена</option>
      <option value="off">Выключена</option>
    </select>
  </div>
  <button class="back-btn" onclick="showMenu()">← Назад в меню</button>
</div>

<!-- GAME -->
<div id="gameWrap">
  <div class="hud">
    <span>🏆 <b id="bestScore">0</b></span>
    <span>⭐ <b id="score">0</b></span>
  </div>
  <div id="canvas-container">
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
  </div>
  <div id="controls">
    <button id="btnStart">▶ Старт</button>
    <button id="btnPause">⏸ Пауза</button>
    <button id="btnReset">↺ Сброс</button>
    <button id="btnMenu" onclick="showMenu()">☰ Меню</button>
  </div>
  <div class="joystick-wrap">
    <div class="joystick-box">
      <span>ДВИЖЕНИЕ</span>
      <div class="joystick" id="moveStick"><div class="stick"></div></div>
    </div>
    <div class="joystick-box">
      <span>ОСМОТР</span>
      <div class="joystick" id="lookStick"><div class="stick"></div></div>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div id="gameOverMsg">
  <div style="font-size:40px;">🌅</div>
  <h3>Игра окончена!</h3>
  <p>Счёт: <b id="finalScore" style="color:#44ff88;">0</b></p>
  <button onclick="resetGame()" style="margin-top:12px;padding:10px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;cursor:pointer;font-weight:700;">Играть снова</button>
  <button onclick="showMenu()" style="margin-top:8px;padding:8px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.3);color:#fff;cursor:pointer;font-size:13px;">☰ Меню</button>
</div>

<div id="leaderboard">
  <h3>🏆 Лучшие результаты</h3>
  <ol id="lbList"><li>Пока нет рекордов</li></ol>
  <button class="leader-close" onclick="hideLeaderboard()">Закрыть</button>
</div>

<script>
// ===== AUDIO =====
let audioCtx = null;
function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') audioCtx.resume(); }
function soundOn() { return document.getElementById('setSound').value === 'on'; }
function vibroOn() { return document.getElementById('setVibro').value === 'on' && navigator.vibrate; }

function playEat() {
  if (!soundOn()) return; initAudio();
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(880, now); o.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
  g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.2);
}
function playCrash() {
  if (!soundOn()) return; initAudio();
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now); o.frequency.exponentialRampToValueAtTime(40, now + 0.4);
  g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.4);
  if (vibroOn()) navigator.vibrate([50, 30, 100]);
}

// ===== NAVIGATION =====
function showMenu() {
  stopGame();
  document.getElementById('menuWrap').style.display = 'flex';
  document.getElementById('gameWrap').style.display = 'none';
  document.getElementById('settingsWrap').style.display = 'none';
  document.getElementById('gameOverMsg').style.display = 'none';
}
function showGame() {
  document.getElementById('menuWrap').style.display = 'none';
  document.getElementById('settingsWrap').style.display = 'none';
  document.getElementById('gameWrap').style.display = 'flex';
  document.getElementById('gameOverMsg').style.display = 'none';
  initGame();
  draw();
}
function showSettings() {
  document.getElementById('menuWrap').style.display = 'none';
  document.getElementById('settingsWrap').style.display = 'flex';
}
function showLeaderboard() {
  const list = document.getElementById('lbList');
  const scores = getScores();
  if (scores.length === 0) { list.innerHTML = '<li>Пока нет рекордов</li>'; }
  else { list.innerHTML = scores.map((s, i) => '<li>' + (i + 1) + '. ' + s + ' очков</li>').join(''); }
  document.getElementById('leaderboard').style.display = 'block';
}
function hideLeaderboard() { document.getElementById('leaderboard').style.display = 'none'; }
function exitApp() { if (confirm('Выйти из игры?')) { window.close(); /* или */ document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#888;font-size:18px;">🐍 До встречи!</div>'; } }

// ===== LEADERBOARD =====
function getScores() { try { return JSON.parse(localStorage.getItem('snakeScores') || '[]'); } catch(e) { return []; } }
function saveScore(s) { const arr = getScores(); arr.push(s); arr.sort((a, b) => b - a); const top = arr.slice(0, 5); try { localStorage.setItem('snakeScores', JSON.stringify(top)); } catch(e) {} }

// ===== GAME =====
const canvas = document.getElementById('snakeCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20, tileCount = canvas.width / gridSize;
let snake = [], apple = {}, dx = 0, dy = 0, score = 0, bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('snakeBest2')) || 0; } catch(e) {}
let gameInterval = null, isRunning = false, isPaused = false, speed = 120, time = 0;

function initGame() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dx = 1; dy = 0; score = 0;
  placeApple(); updateScore();
  document.getElementById('gameOverMsg').style.display = 'none';
}
function placeApple() { do { apple = {x:Math.floor(Math.random()*tileCount),y:Math.floor(Math.random()*tileCount)}; } while (snake.some(s => s.x===apple.x && s.y===apple.y)); }
function updateScore() { document.getElementById('score').textContent = score; document.getElementById('bestScore').textContent = bestScore; }

function getSnakeColor(i, total) {
  const style = document.getElementById('setStyle').value;
  const t = i / Math.max(total, 1);
  if (style === 'rainbow') return 'hsl(' + ((t * 300 + time * 2) % 360) + ',85%,60%)';
  if (style === 'fire') return 'rgb(255,' + Math.floor(100 + t * 155) + ',' + Math.floor(t * 50) + ')';
  if (style === 'neon') return 'hsl(' + (280 + t * 60) + ',100%,65%)';
  return 'rgb(255,' + Math.floor(180 + t * 75) + ',' + Math.floor(t * 100) + ')';
}

function drawBackground() {
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#ffcc88';
  for (let i = 0; i < 5; i++) {
    const cx = (time * 0.5 + i * 80) % (canvas.width + 100) - 50;
    const cy = 40 + i * 15 + Math.sin(time * 0.02 + i) * 10;
    ctx.beginPath(); ctx.ellipse(cx, cy, 35, 12, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,200,150,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= tileCount; i++) {
    ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
  }
}
function drawApple() {
  const cx = apple.x * gridSize + gridSize / 2, cy = apple.y * gridSize + gridSize / 2, r = gridSize / 2 - 2;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx + 2, cy + 3, r * 0.9, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r);
  grad.addColorStop(0, '#ff6b6b'); grad.addColorStop(0.5, '#ee5a5a'); grad.addColorStop(1, '#c0392b');
  ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(cx - 3, cy - 4, r * 0.3, r * 0.2, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - r + 2); ctx.quadraticCurveTo(cx + 2, cy - r - 4, cx + 4, cy - r - 2); ctx.stroke();
  ctx.fillStyle = '#4caf50';
  ctx.beginPath(); ctx.ellipse(cx + 5, cy - r - 2, 5, 3, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#66bb6a';
  ctx.beginPath(); ctx.ellipse(cx + 5, cy - r - 3, 3, 2, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 15;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,100,100,0.3)'; ctx.lineWidth = 2; ctx.stroke(); ctx.shadowBlur = 0;
}
function drawSnake() {
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const x = seg.x * gridSize, y = seg.y * gridSize;
    const pad = isHead ? 1 : 2, size = gridSize - pad * 2;
    const color = getSnakeColor(i, snake.length);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.roundRect(x + pad + 1, y + pad + 2, size, size, size / 3); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x + pad, y + pad, size, size, size / 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.roundRect(x + pad + 1, y + pad + 1, size * 0.6, size * 0.4, size / 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.roundRect(x + pad, y + pad, size, size, size / 3); ctx.stroke();
    if (isHead) {
      const eyeOffset = 4, eyeSize = 3, eyeY = y + pad + size / 2 - 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + pad + eyeOffset, eyeY, eyeSize, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + pad + size - eyeOffset, eyeY, eyeSize, 0, Math.PI * 2); ctx.fill();
      let px1 = x + pad + eyeOffset, py1 = eyeY, px2 = x + pad + size - eyeOffset, py2 = eyeY;
      if (dx === 1) { px1++; px2++; } else if (dx === -1) { px1--; px2--; }
      if (dy === 1) { py1++; py2++; } else if (dy === -1) { py1--; py2--; }
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(px1, py1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px2, py2, 1.5, 0, Math.PI * 2); ctx.fill();
      if (time % 40 < 5) {
        ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 1.5;
        const tx = x + pad + size / 2, ty = y + pad + size;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + dx * 6, ty + dy * 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx + dx * 6, ty + dy * 6); ctx.lineTo(tx + dx * 8 - dy * 2, ty + dy * 8 + dx * 2);
        ctx.moveTo(tx + dx * 6, ty + dy * 6); ctx.lineTo(tx + dx * 8 + dy * 2, ty + dy * 8 - dx * 2); ctx.stroke();
      }
    }
  });
}
function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawBackground(); drawApple(); drawSnake(); time++;
}
function gameLoop() {
  if (!isRunning || isPaused) return;
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) { playCrash(); gameOver(); return; }
  if (snake.some(s => s.x === head.x && s.y === head.y)) { playCrash(); gameOver(); return; }
  snake.unshift(head);
  if (head.x === apple.x && head.y === apple.y) {
    playEat(); score += 10;
    if (score > bestScore) { bestScore = score; try { localStorage.setItem('snakeBest2', bestScore); } catch(e) {} }
    updateScore(); placeApple();
  } else { snake.pop(); }
  draw();
}
function gameOver() {
  isRunning = false; clearInterval(gameInterval);
  saveScore(score);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverMsg').style.display = 'block';
}
function startGame() {
  if (isRunning) return;
  if (!isPaused) initGame();
  isRunning = true; isPaused = false;
  speed = parseInt(document.getElementById('setSpeed').value);
  clearInterval(gameInterval); gameInterval = setInterval(gameLoop, speed);
  draw(); document.getElementById('btnPause').textContent = '⏸ Пауза';
}
function pauseGame() {
  if (!isRunning && !isPaused) return;
  isPaused = !isPaused;
  document.getElementById('btnPause').textContent = isPaused ? '▶ Продолжить' : '⏸ Пауза';
  if (!isPaused) { speed = parseInt(document.getElementById('setSpeed').value); clearInterval(gameInterval); gameInterval = setInterval(gameLoop, speed); }
}
function resetGame() {
  isRunning = false; isPaused = false; clearInterval(gameInterval);
  document.getElementById('btnPause').textContent = '⏸ Пауза';
  initGame(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); draw();
}
function stopGame() { isRunning = false; isPaused = false; clearInterval(gameInterval); }
function setDirection(ndx, ndy) { if (!isRunning || isPaused) return; if (ndx === -dx && ndy === -dy) return; dx = ndx; dy = ndy; }

document.addEventListener('keydown', (e) => {
  switch(e.key) { case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break; case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break; case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break; case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break; case ' ': e.preventDefault(); pauseGame(); break; }
});
document.getElementById('btnStart').onclick = startGame;
document.getElementById('btnPause').onclick = pauseGame;
document.getElementById('btnReset').onclick = resetGame;

// Joysticks
function setupStick(id, cb) {
  const zone = document.getElementById(id);
  const stick = zone.querySelector('.stick');
  const maxDist = 30;
  let active = false, sid = null;
  function getCenter() { const r = zone.getBoundingClientRect(); return {x: r.left + r.width/2, y: r.top + r.height/2}; }
  function update(cx, cy) {
    const c = getCenter();
    let dx = cx - c.x, dy = cy - c.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > maxDist) { dx = dx/d*maxDist; dy = dy/d*maxDist; }
    stick.style.transform = 'translate(' + (dx) + 'px,' + (dy) + 'px)';
    cb(dx/maxDist, dy/maxDist);
  }
  zone.addEventListener('touchstart', e => { e.preventDefault(); active = true; sid = e.changedTouches[0].identifier; update(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive:false});
  zone.addEventListener('touchmove', e => { e.preventDefault(); for (let t of e.changedTouches) if (t.identifier === sid) { update(t.clientX, t.clientY); break; } }, {passive:false});
  function end(e) { for (let t of e.changedTouches) if (t.identifier === sid) { active = false; sid = null; stick.style.transform = 'translate(0,0)'; cb(0,0); break; } }
  zone.addEventListener('touchend', end, {passive:false});
  zone.addEventListener('touchcancel', end, {passive:false});
}
setupStick('moveStick', (x, y) => {
  if (!isRunning || isPaused) return;
  const forward = new THREE ? null : null; // not used
  // Simple directional from joystick
  if (Math.abs(x) > 0.3 || Math.abs(y) > 0.3) {
    if (Math.abs(x) > Math.abs(y)) setDirection(x > 0 ? 1 : -1, 0);
    else setDirection(0, y > 0 ? 1 : -1);
  }
});

// Swipe on canvas
let tsX = 0, tsY = 0;
canvas.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx2 = e.changedTouches[0].clientX - tsX, dy2 = e.changedTouches[0].clientY - tsY;
  if (Math.abs(dx2) < 20 && Math.abs(dy2) < 20) return;
  if (Math.abs(dx2) > Math.abs(dy2)) setDirection(dx2 > 0 ? 1 : -1, 0); else setDirection(0, dy2 > 0 ? 1 : -1);
}, {passive:true});

// Init
initGame(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); draw(); updateScore();

// Register SW
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
